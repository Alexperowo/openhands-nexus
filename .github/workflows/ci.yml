name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Validate Python Syntax (py_compile)
        run: |
          python -m compileall -q Config local-voice openhands-pwa OpenHands-Tests

      - name: Run Ruff Lint
        run: |
          ruff check . --ignore E501,B008

      - name: Validate Node.js Syntax
        run: |
          node --check openhands-pwa/lan-gateway.mjs
          node --check openhands-pwa/sw.js
          node --check openhands-working-profile/working-profile-ui.js
          node --check local-voice/voice-bridge.js
