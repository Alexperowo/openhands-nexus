[project]
name = "openhands-nexus"
version = "1.0.0"
description = "Local autonomous multi-model OpenHands workstation for Windows 11 with CUDA and PWA Remote Control"
authors = [{ name = "Alexperowo" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    "AgentCanvas-Test",
    "Archive",
    "LLM-tests",
    "Logs",
    "OpenHands-Tests",
    "Tests",
    "Temp",
    "scratch",
    "ksenia-android",
    "ik_llama",
    "llama-mainline",
    "transcribe-build-shared",
    "local-voice/transcribe_cpp",
    "local-voice/bin",
    "openhands-localization/audit-localization.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "E402",   # module level import not at top of file
    "SIM105", # try-except-pass vs contextlib.suppress
    "SIM115", # open without context manager in global logging setup
]

[tool.pytest.ini_options]
testpaths = ["tests", "OpenHands-Tests", "Tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
