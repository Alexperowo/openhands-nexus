[project]
name = "openhands-nexus"
version = "1.0.0"
description = "Local autonomous multi-model OpenHands workstation for Windows 11 with CUDA and PWA Remote Control"
authors = [{ name = "Alexperowo" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests", "OpenHands-Tests", "Tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
