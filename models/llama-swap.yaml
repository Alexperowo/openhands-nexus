# Меню моделей Nexus: llama-swap держит одну модель за раз и переключает по полю "model" запроса.
# Слушает 127.0.0.1:18030 (launcher/run.sh models, рабочая папка — models/); каждая модель — свой ik_llama llama-server на ${PORT}.
# CUDA_DEVICE_ORDER=PCI_BUS_ID: CUDA0 = RTX 5060 Ti 16 ГБ, CUDA1 = RTX 2080 Ti 22 ГБ.
# Nex — MoE qwen35moe (40 слоёв, 256 экспертов); Tess и Holo4 — плотные Qwen3.8-27B.
# metadata.ctx — окно сервера, для справки: агенту окно задаёт max_input_tokens профиля (agent/config/profiles.json),
# сжатие беседы начинается с 70% от него.
# Tess: MTP-головы в файле; замер 25.10: генерация 19→28 ток/с, обработка промпта −23% — на шаге агента выигрыш.

healthCheckTimeout: 600
logLevel: info
# The models' own output goes to the journal too (journalctl --user -u ohn-models): prompt reading,
# cache reuse and errors of llama-server were invisible with the default "proxy".
logToStdout: "proxy,upstream"
startPort: 18040
globalTTL: 0
unloadTimeout: 15
sendLoadingState: false

# Запуск Nexus сразу загружает основную модель: первый запрос не ждёт загрузки.
hooks:
  on_startup:
    preload: ["nex25"]

macros:
  # Two links the installer makes in models/ (not in git): llama-server -> the ik_llama build,
  # weights -> the folder with the weights. The paths here are relative to models/.
  server: ./llama-server
  nex_dir: weights/Nex-N2.5-mini-OrcaRouter
  tess_dir: weights/Tess-4.5-27B
  holo_dir: weights/Holo4-27B
  holo_weights: -m ${holo_dir}/Holo4-27B-q4_k_m.gguf --mmproj ${holo_dir}/Holo4-27B-mmproj.f16.gguf
  holo_devices: -dev CUDA0,CUDA1 -sm layer -ts 16,20 -ngl 999 -c 262144
  # --metrics: numbers only (KV tokens, requests in progress), no prompt text. The status line of
  # the interface reads them to tell reading the context from writing the answer and from a stall.
  # At the thinking budget (thinking_budget_tokens of the request) the server ends the thought with
  # this text and </think> instead of cutting it mid-word. The server takes it as is: the newlines
  # are real ones from this double-quoted YAML string, llama-swap keeps them inside the quotes.
  budget_message: "--reasoning-budget-message \"\n\nThinking budget reached. I will act now on the best option, or tell the user what blocks me.\n\""
  common: >-
    --host 127.0.0.1 --port ${PORT}
    -fa on -ctk q8_0 -ctv q8_0 -b 2048 -ub 512 -np 1 -t 6
    --image-min-tokens 1024
    --reasoning-format deepseek --reasoning-budget -1 ${budget_message}
    --jinja --metrics
  nex_template: --chat-template-file nex-stock.jinja
  # The agent sends these same defaults from agent/config/profiles.json.
  nex_sampling: --temp 0.7 --top-p 0.95 --top-k 40 --min-p 0
  qwen_sampling: --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0

models:
  nex25:
    name: "Nex 25G — обе карты"
    description: "Основная модель агента"
    aliases: ["nex"]
    env: &env_cuda1_vision
      - "CUDA_DEVICE_ORDER=PCI_BUS_ID"
      - "NCCL_SOCKET_IFNAME=lo"
      - "MTMD_BACKEND_DEVICE=CUDA1"
      - "LD_LIBRARY_PATH=/usr/local/cuda-13.1/lib64"
    # -ub 2048 (the later -ub overrides common), measured 27.10: prompt reading 1.3-1.5x faster (45K 34.2 -> 23.0 s,
    # 126K 133 -> 99 s, a full window with a screenshot 324 -> 258 s), generation unchanged, peak 14.0/19.3 GB.
    # KLD to an f16-cache reference is the same for -ub 256/512/2048 (0.0149/0.0150/0.0146, perplexity equal);
    # -ub 4096 gives nothing more and leaves 0.4 GB on the 5060 Ti.
    cmd: |
      ${server}
      -m ${nex_dir}/Nex-N2.5-mini-OrcaRouter-Sangreal-25G-ICEv2.gguf
      --mmproj ${nex_dir}/mmproj-Nex-N2.5-mini-OrcaRouter-Q8_0.gguf
      -dev CUDA0,CUDA1 -sm layer -ts 16,20 -ngl 999 -c 262144
      ${nex_template} ${nex_sampling} ${common} -ub 2048
    metadata: {ctx: 262144}
    disableKeepAlives: true

  nex19-2080:
    name: "Nex 19G — RTX 2080 Ti"
    description: "Одна карта 2080 Ti, эксперты 3 слоёв в ОЗУ, 5060 Ti свободна"
    # A single-card profile names its card by UUID, not by number: with the other card gone the numbers
    # shift (this one would become CUDA0), and launcher/watch.py then moves the agent here from profiles
    # that need the lost card. Inside the process the pinned card is CUDA0.
    env:
      - "CUDA_DEVICE_ORDER=PCI_BUS_ID"
      - "CUDA_VISIBLE_DEVICES=GPU-edf061f2-691d-d6fb-d083-e5b1c42d0720"
      - "MTMD_BACKEND_DEVICE=CUDA0"
      - "LD_LIBRARY_PATH=/usr/local/cuda-13.1/lib64"
    # 128K uses q8_0 K and q4_0 V. Three layers' experts in RAM leave room for GPU vision.
    # Measured 24.11: 122067 input tokens with a 1920x1080 screenshot, peak 20484/22528 MiB
    # including the desktop, request 139.5 s. Without RAM experts the peak was 21472 MiB.
    # K/V q4_0/q4_0 alone left only 1376 MiB free. Keep K at q8_0 for tool calling.
    cmd: |
      ${server}
      -m ${nex_dir}/Nex-N2.5-mini-OrcaRouter-Sangreal-19G-ICEv2.gguf
      --mmproj ${nex_dir}/mmproj-Nex-N2.5-mini-OrcaRouter-Q8_0.gguf
      -dev CUDA0 -ngl 999 --n-cpu-moe 3 -c 131072
      ${nex_template} ${nex_sampling} ${common} -ctk q8_0 -ctv q4_0
    metadata: {ctx: 131072}
    disableKeepAlives: true

  nex19-5060:
    name: "Nex 19G — RTX 5060 Ti + ОЗУ"
    description: "Одна карта 5060 Ti, эксперты 22 слоёв в ОЗУ, 2080 Ti свободна"
    env:
      - "CUDA_DEVICE_ORDER=PCI_BUS_ID"
      - "CUDA_VISIBLE_DEVICES=GPU-aefa95ef-fb59-5594-0817-18dd07d74a09"
      - "MTMD_BACKEND_DEVICE=CUDA0"
      - "LD_LIBRARY_PATH=/usr/local/cuda-13.1/lib64"
    # -ub 2048 moves RAM experts to the GPU for prompt reading. Measured 27.10: 45K in 40 s
    # instead of 165 s, generation 31 vs 33 tok/s. KLD to f16 cache: 0.0126 vs 0.0124.
    # GPU vision needs q8_0 K/q4_0 V and 22 layers' experts in RAM to keep a ~2 GiB reserve.
    # Measured 24.11: 122067 input tokens with a 1920x1080 screenshot, peak 14259/16311 MiB,
    # image encoding 2.0 s, request 94.8 s (CPU vision: 80-84 s and 167-171 s respectively).
    # With 20 RAM layers, q8_0/q4_0 left 1238 MiB free, q4_0/q4_0 left 1558 MiB.
    cmd: |
      ${server}
      -m ${nex_dir}/Nex-N2.5-mini-OrcaRouter-Sangreal-19G-ICEv2.gguf
      --mmproj ${nex_dir}/mmproj-Nex-N2.5-mini-OrcaRouter-Q8_0.gguf
      -dev CUDA0 -ngl 999 --n-cpu-moe 22 -c 131072
      ${nex_template} ${nex_sampling} ${common} -ub 2048 -ctk q8_0 -ctv q4_0
    metadata: {ctx: 131072}
    disableKeepAlives: true

  tess:
    name: "Tess 4.5 27B — обе карты"
    description: "Агентная модель migtissera, Q5_K_M"
    env: *env_cuda1_vision
    # -ts 16,20 ran out of memory on the 2080 Ti with a screenshot over a ~226K prompt (peak 22.0 GB);
    # 17,19 passes it at 15.6/21.6 GB. MTP n_max=3: 31.5 -> 35.7 tok/s, answers at temp 0 unchanged;
    # n_max=4 failed the full window. Measured 28.10.
    cmd: |
      ${server}
      -m ${tess_dir}/migtissera_Tess-4.5-27B-Q5_K_M.gguf
      --mmproj ${tess_dir}/mmproj-Tess-4.5-27B-F16.gguf
      -dev CUDA0,CUDA1 -sm layer -ts 17,19 -ngl 999 -c 262144
      --spec-type mtp:n_max=3
      ${qwen_sampling} ${common}
    metadata: {ctx: 262144}
    disableKeepAlives: true

  holo:
    name: "Holo4 27B — обе карты"
    description: "Управление экраном (H Company), Q4_K_M"
    env: *env_cuda1_vision
    # -ub 2048 (the later -ub overrides common): a ~226K prompt with a screenshot 742 -> 694 s, peak
    # 14.1/18.8 GB, answers at temp 0 unchanged. Measured 28.10.
    cmd: |
      ${server}
      ${holo_weights}
      ${holo_devices}
      ${qwen_sampling} ${common} -ub 2048
    metadata: {ctx: 262144}
    disableKeepAlives: true
