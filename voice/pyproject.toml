[project]
name = "nexus-voice"
version = "0.1.0"
description = "OpenHands-Nexus voice service: STT GigaAM v3 + TTS Silero v5.6"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "torch>=2.2.0,<=2.5.1",
    "torchaudio>=2.2.0,<=2.5.1",
    "gigaam>=0.1.0",
    "soundfile>=0.12.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
gigaam = { git = "https://github.com/salute-developers/GigaAM.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
