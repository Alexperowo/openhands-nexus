      -ctk q6_0
      -ctv q4_0
      -fa on
      -ngl 999
      -np 1
      -dev CUDA0,CUDA1
      -ts 14,22
      -t 6
      -tb 2
      --slot-save-path K:\Project\Cache\slots
      --spec-type mtp:n_max=3,p_min=0.05
      --reasoning-format deepseek
      --reasoning-budget 4096
      --reasoning-budget-message "Conclude reasoning immediately and output the final answer now."
      --jinja
      --temp 0.7
